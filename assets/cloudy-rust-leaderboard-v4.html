<!doctype html><html lang="en"><head><meta charset="utf-8"/><style>
*{box-sizing:border-box}
html,body{width:1200px;height:480px;margin:0;overflow:hidden;background:#0b0c0f}
body{color:#f7f5f5;font-family:"Bahnschrift","Arial",sans-serif;-webkit-font-smoothing:antialiased}
.poster{width:1200px;height:480px;position:relative;overflow:hidden;background:radial-gradient(ellipse 670px 410px at 83% 77%,rgba(122,23,18,.3),transparent 83%),radial-gradient(ellipse 490px 360px at 26% -25%,rgba(126,22,18,.22),transparent 85%),linear-gradient(118deg,#0b0c10,#151216 76%,#1c1114)}
.poster:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(131deg,transparent 0 92px,rgba(255,255,255,.022) 93px,transparent 94px)}
.topline{height:5px;position:absolute;inset:0 0 auto;background:linear-gradient(90deg,#481210,#b1322b,#3b0c0b)}
.brand{position:absolute;right:49px;top:31px;display:flex;align-items:center;gap:10px;font-size:17px;letter-spacing:.08em;color:#a6a3aa}
.brand img{width:109px;height:109px;object-fit:contain;mix-blend-mode:screen}
.eyebrow{position:absolute;left:61px;top:43px;font-size:17px;letter-spacing:.09em;color:#a9a4ad}
.eyebrow:before{content:"";height:13px;width:4px;display:inline-block;vertical-align:-1px;margin-right:12px;border-radius:3px;background:#b0382d}
h1{position:absolute;top:75px;left:56px;font-size:78px;line-height:1;margin:0;letter-spacing:-3px;font-weight:800}
.subtitle{position:absolute;top:170px;left:61px;font-size:23px;color:#beb9c1}
.line{position:absolute;left:60px;right:60px;top:212px;height:1px;background:linear-gradient(90deg,#952c25,rgba(160,55,50,.26),transparent)}
.cards{position:absolute;left:60px;right:60px;top:238px;display:grid;grid-template-columns:1fr 1.10fr 1fr;gap:13px}
.card{position:relative;height:175px;padding:22px;border-radius:15px;border:1px solid rgba(255,255,255,.11);background:linear-gradient(136deg,rgba(255,255,255,.076),rgba(255,255,255,.023))}
.card.first{border:1px solid rgba(183,64,54,.65);background:linear-gradient(137deg,rgba(122,23,18,.23),rgba(255,255,255,.025));box-shadow:0 8px 38px rgba(70,15,13,.18)}
.card:before{content:"";height:2px;position:absolute;top:-1px;left:19px;right:19px;background:linear-gradient(90deg,transparent,rgba(235,228,230,.21),transparent)}
.card.first:before{background:linear-gradient(90deg,transparent,#d25242,transparent)}
.num{font-size:43px;font-weight:800;line-height:1;letter-spacing:-1.4px;color:#a4a0a8}
.first .num{color:#efa69d}
.place{position:absolute;top:31px;left:89px;font-size:17px;color:#a9a4ac}
.player{position:absolute;top:88px;left:23px;font-size:31px;line-height:1;font-weight:700;letter-spacing:-.45px}
.third .player{font-size:27px;color:#bbb5bd}
.divider{position:absolute;left:23px;right:23px;top:129px;height:1px;background:rgba(255,255,255,.09)}
.metrics{position:absolute;top:142px;left:23px;font-size:15px;color:#bdb8c0;white-space:nowrap;letter-spacing:.01em}
.metrics b{font-weight:700;color:#ece8e9}
.corner{position:absolute;left:62px;bottom:17px;font-size:15px;color:#86818b;letter-spacing:.06em}
.bottom{position:absolute;bottom:0;height:6px;left:0;right:0;background:linear-gradient(90deg,#42100f,#7a1712,#45100e)}
</style></head><body><div class="poster">
<div class="topline"></div><div class="eyebrow">Cloudy Inc. / Rust console</div><h1>Rust leaderboard</h1>
<div class="subtitle">Current wipe · Top players</div>
<div class="brand"><span>Cloudy Inc.</span><img src="cloudy-c-logo-static.png" alt="Cloudy Inc. logo"></div>
<div class="line"></div>
<div class="cards">
 <div class="card"><div class="num">02</div><div class="place">Second place</div><div class="player">serseny</div><div class="divider"></div><div class="metrics">Kills <b>142</b> &nbsp; Deaths <b>67</b> &nbsp; K/D <b>2.12</b></div></div>
 <div class="card first"><div class="num">01</div><div class="place">First place</div><div class="player">Mindzset</div><div class="divider"></div><div class="metrics">Kills <b>186</b> &nbsp; Deaths <b>54</b> &nbsp; K/D <b>3.44</b></div></div>
 <div class="card third"><div class="num">03</div><div class="place">Third place</div><div class="player">Unclaimed</div><div class="divider"></div><div class="metrics">Kills <b>—</b> &nbsp; Deaths <b>—</b> &nbsp; K/D <b>—</b></div></div>
</div>
<div class="corner">Example scores · Cloudy leaderboard</div><div class="bottom"></div></div></body></html>
