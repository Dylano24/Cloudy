name: Cloudy performance workspace
on:
  push:
    branches: [perf/embed-builder-consistent-loading-2026-10-25]
    paths: [.github/workflows/cloudy-performance-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Package isolated test workspace
        run: tar --exclude=.git --exclude=cloudy-performance-workspace.tgz -czf /tmp/cloudy-performance-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: cloudy-performance-workspace
          path: /tmp/cloudy-performance-workspace.tgz
          retention-days: 1
