name: Refresh lockfile

on:
  push:
    branches:
      - chatgpt-reliability-hardening-20260911
    paths:
      - '.github/workflows/refresh-lockfile.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: chatgpt-reliability-hardening-20260911
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh package lock for safe dependency versions'

          # Another validation commit may land while this job is running. Rebase
          # the generated lockfile commit onto the latest branch head before push.
          git pull --rebase origin chatgpt-reliability-hardening-20260911
          git push origin HEAD:chatgpt-reliability-hardening-20260911
