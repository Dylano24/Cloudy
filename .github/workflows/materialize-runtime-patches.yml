name: Materialize Runtime Patches

on:
  push:
    branches:
      - chatgpt-commercial-hardening-20260910
    paths:
      - '.github/workflows/materialize-runtime-patches.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-runtime-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-commercial-hardening-20260910
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply the exact production patch chain and run regression tests
        run: npm test

      - name: Refuse unexpected generated changes
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Production patch output is already materialized."
            exit 0
          fi
          printf 'Materialized paths:\n%s\n' "${changed[@]}"
          for file in "${changed[@]}"; do
            case "$file" in
              src/*) ;;
              *) echo "Refusing unexpected non-src patch output: $file"; exit 1 ;;
            esac
          done

      - name: Commit and push exact verified runtime source state
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "Production patch output is already materialized."
            exit 0
          fi
          git config user.name "Cloudy Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Materialize verified runtime patch state"
          git push
