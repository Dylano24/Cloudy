name: Docker Publish

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime permissions
        if: github.event_name == 'pull_request'
        env:
          SMOKE_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -euo pipefail
          MEDIA_VOLUME="cloudy-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$MEDIA_VOLUME" >/dev/null
          trap 'docker volume rm "$MEDIA_VOLUME" >/dev/null' EXIT
          # Use the real entrypoint, not --entrypoint node: the former fixes
          # Railway's fresh root-owned mount then execs node as the node user.
          docker run --rm \
            --mount "type=volume,src=$MEDIA_VOLUME,dst=/cloudy-media" \
            -e CLOUDY_EMBED_MEDIA_DIR=/cloudy-media/embeds \
            "$SMOKE_IMAGE" node -e '
              const fs = require("node:fs");
              if (process.getuid() === 0) throw new Error("Runtime must be non-root");
              fs.accessSync("logs", fs.constants.W_OK);
              fs.accessSync("src/config/bot.js", fs.constants.W_OK);
              const path = "/cloudy-media/embeds/.smoke-test";
              fs.writeFileSync(path, "ok");
              fs.rmSync(path);
            '
