name: ChatGPT Safe Scan

on:
  push:
    branches:
      - chatgpt-safe-scan-20260830
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --json || true

      - name: Node tests
        run: node --test

      - name: ESLint
        run: npm run lint
