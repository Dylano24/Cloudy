name: ChatGPT Safe Scan

on:
  push:
    branches:
      - chatgpt-safe-scan-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply lockfile-only security fixes
        run: npm audit fix --package-lock-only

      - name: Ensure dependency ranges were not changed
        run: git diff --exit-code -- package.json

      - name: Install fixed dependencies
        run: npm ci

      - name: Verify dependency audit
        run: npm audit --audit-level=low

      - name: Node tests
        run: node --test

      - name: ESLint
        run: npm run lint

      - name: Commit validated lockfile
        if: success()
        run: |
          git config user.name "ChatGPT Safe Scan"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update dependencies for security fixes"
            git push
          fi
