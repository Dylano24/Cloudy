name: ChatGPT Safe Scan

on:
  push:
    branches:
      - chatgpt-safe-scan-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply safe fixes
        run: node scripts/chatgpt-safe-fixes.mjs

      - name: Node tests
        run: node --test

      - name: ESLint
        run: npm run lint

      - name: Commit validated fixes
        if: success()
        run: |
          git config user.name "ChatGPT Safe Scan"
          git config user.email "actions@users.noreply.github.com"
          git add eslint.config.js src/commands/Core/help.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix hard lint runtime issue safely"
            git push
          fi
