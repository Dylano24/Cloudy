name: Apply ticket button layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ticket-button-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch ticket controls
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/services/ticketUiService.js')
          text = path.read_text(encoding='utf-8')

          old = """export function buildCloudyTicketControls({ claimedBy = null } = {}) {
  const claimButton = claimedBy
    ? new ButtonBuilder()
      .setCustomId('ticket_unclaim')
      .setLabel('Unclaim')
      .setStyle(ButtonStyle.Secondary)
      .setEmoji('🔓')
    : new ButtonBuilder()
      .setCustomId('ticket_claim')
      .setLabel('Claim')
      .setStyle(ButtonStyle.Success)
      .setEmoji('✋🏽');

  return new ActionRowBuilder().addComponents(
    claimButton,
    new ButtonBuilder()
      .setCustomId('ticket_pin')
      .setLabel('Pin')
      .setStyle(ButtonStyle.Secondary)
      .setEmoji(PIN_EMOJI),
    new ButtonBuilder()
      .setCustomId('ticket_priority_menu')
      .setLabel('Priority')
      .setStyle(ButtonStyle.Secondary)
      .setEmoji('🟡'),
    new ButtonBuilder()
      .setCustomId('ticket_close')
      .setLabel('Close')
      .setStyle(ButtonStyle.Danger)
      .setEmoji('🔒'),
  );
}
"""

          new = """export function buildCloudyTicketControls({ claimedBy = null } = {}) {
  const claimButton = claimedBy
    ? new ButtonBuilder()
      .setCustomId('ticket_unclaim')
      .setLabel('Unclaim')
      .setStyle(ButtonStyle.Secondary)
      .setEmoji('🔓')
    : new ButtonBuilder()
      .setCustomId('ticket_claim')
      .setLabel('Claim')
      .setStyle(ButtonStyle.Success)
      .setEmoji('✋🏽');

  const closeButton = new ButtonBuilder()
    .setCustomId('ticket_close')
    .setLabel('Close')
    .setStyle(ButtonStyle.Danger)
    .setEmoji('🔒');

  const priorityButton = new ButtonBuilder()
    .setCustomId('ticket_priority_menu')
    .setLabel('Priority')
    .setStyle(ButtonStyle.Secondary)
    .setEmoji('🟡');

  const pinButton = new ButtonBuilder()
    .setCustomId('ticket_pin')
    .setLabel('Pin')
    .setStyle(ButtonStyle.Secondary)
    .setEmoji(PIN_EMOJI);

  return [
    new ActionRowBuilder().addComponents(claimButton, closeButton),
    new ActionRowBuilder().addComponents(priorityButton),
    new ActionRowBuilder().addComponents(pinButton),
  ];
}
"""

          if old not in text:
              raise SystemExit('Expected ticket control block not found; refusing to guess.')

          text = text.replace(old, new, 1)
          text = text.replace(
              "components: isClosed ? [] : [buildCloudyTicketControls({ claimedBy: ticketData.claimedBy })],",
              "components: isClosed ? [] : buildCloudyTicketControls({ claimedBy: ticketData.claimedBy }),",
              1,
          )
          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "Cloudy Bot Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add src/services/ticketUiService.js
          git diff --cached --quiet && exit 0
          git commit -m "Rearrange ticket action buttons"
          git push origin main
