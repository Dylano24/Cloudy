name: Final cleanup patch

on:
  push:
    branches:
      - chatgpt-final-cleanup-20260911
    paths:
      - '.github/workflows/final-cleanup-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: chatgpt-final-cleanup-20260911
          fetch-depth: 0

      - name: Apply five-second error cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          error_handler = Path('src/utils/errorHandler.js')
          source = error_handler.read_text(encoding='utf-8-sig')
          old = 'const ERROR_RESPONSE_TTL_MS = 10_000;'
          new = 'const ERROR_RESPONSE_TTL_MS = 5_000;'
          if old not in source and new not in source:
              raise SystemExit('Expected error response TTL constant not found')
          error_handler.write_text(source.replace(old, new), encoding='utf-8')

          tests = Path('test/dedicatedChannels.test.js')
          source = tests.read_text(encoding='utf-8-sig')
          source = source.replace('disappear elsewhere after 10 seconds', 'disappear elsewhere after 5 seconds')
          source = source.replace('t.mock.timers.tick(9999);', 't.mock.timers.tick(4999);')
          tests.write_text(source, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/utils/errorHandler.js test/dedicatedChannels.test.js; then
            echo 'Cleanup patch already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/errorHandler.js test/dedicatedChannels.test.js
          git commit -m 'Use five second error feedback lifetime'
          git pull --rebase origin chatgpt-final-cleanup-20260911
          git push origin HEAD:chatgpt-final-cleanup-20260911
