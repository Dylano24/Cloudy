name: Deep Audit

on:
  push:
    branches:
      - audit-deep-scan-2026-09-04

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup production Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm

      - name: Prepare audit output
        run: mkdir -p audit-output

      - name: Repository inventory
        shell: bash
        run: |
          set -u
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=$(git branch --show-current)"
            echo "TRACKED_FILES=$(git ls-files | wc -l)"
            echo "JS_FILES=$(git ls-files '*.js' | wc -l)"
            echo "TOTAL_BYTES=$(git ls-files -z | xargs -0 -r wc -c | tail -n 1 | awk '{print $1}')"
          } | tee audit-output/summary.txt
          git ls-files | sort > audit-output/tracked-files.txt
          git ls-files -z | xargs -0 -r sha256sum > audit-output/file-sha256.txt
          git ls-files -z | xargs -0 -r wc -c | sort -nr > audit-output/file-bytes.txt
          git ls-files | awk -F. 'NF>1{print tolower($NF)} NF==1{print "[no-ext]"}' | sort | uniq -c | sort -nr > audit-output/file-types.txt
          sed -n '1,80p' audit-output/file-bytes.txt

      - name: Install dependencies exactly
        run: npm ci

      - name: Dependency integrity and advisories
        shell: bash
        run: |
          set +e
          node --version > audit-output/node-version.txt
          npm --version >> audit-output/node-version.txt
          npm ls --all > audit-output/npm-ls.txt 2>&1
          echo $? > audit-output/npm-ls.exit
          npm audit --json > audit-output/npm-audit.json 2>&1
          echo $? > audit-output/npm-audit.exit
          npm audit --omit=dev --json > audit-output/npm-audit-prod.json 2>&1
          echo $? > audit-output/npm-audit-prod.exit
          npm outdated --json > audit-output/npm-outdated.json 2>&1
          echo $? > audit-output/npm-outdated.exit
          npm dedupe --dry-run > audit-output/npm-dedupe.txt 2>&1
          echo $? > audit-output/npm-dedupe.exit
          exit 0

      - name: Syntax check every JavaScript file
        shell: bash
        run: |
          set +e
          failures=0
          count=0
          : > audit-output/syntax.txt
          while IFS= read -r -d '' file; do
            count=$((count+1))
            if ! node --check "$file" >> audit-output/syntax.txt 2>&1; then
              echo "SYNTAX_FAIL $file" | tee -a audit-output/syntax.txt
              failures=$((failures+1))
            fi
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)
          echo "JS_CHECKED=$count" | tee -a audit-output/syntax.txt
          echo "JS_SYNTAX_FAILURES=$failures" | tee -a audit-output/syntax.txt
          echo "$failures" > audit-output/syntax-failures.count
          exit 0

      - name: Full lint
        shell: bash
        run: |
          set +e
          npm run lint > audit-output/lint.txt 2>&1
          echo $? > audit-output/lint.exit
          tail -n 120 audit-output/lint.txt || true
          exit 0

      - name: Full test suite
        shell: bash
        run: |
          set +e
          npm test > audit-output/tests.txt 2>&1
          echo $? > audit-output/tests.exit
          tail -n 160 audit-output/tests.txt || true
          exit 0

      - name: Detect runtime patch drift
        shell: bash
        run: |
          set +e
          git status --short > audit-output/git-status-after-tests.txt
          git diff -- src scripts > audit-output/runtime-patch-diff.txt
          echo "CHANGED_TRACKED_AFTER_TESTS=$(git status --short | wc -l)" | tee audit-output/runtime-patch-summary.txt
          git status --short | tee -a audit-output/runtime-patch-summary.txt
          exit 0

      - name: Relative import graph
        shell: bash
        run: |
          python3 - <<'PY' > audit-output/import-check.txt
          import os,re,subprocess
          files=[p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p.endswith(('.js','.mjs','.cjs'))]
          rx=re.compile(r'''(?:from\s+|import\s*\(|require\s*\()\s*['\"](\.{1,2}/[^'\"]+)''')
          bad=[]
          for p in files:
              try:s=open(p,encoding='utf-8').read()
              except Exception:continue
              for m in rx.finditer(s):
                  raw=m.group(1).split('?',1)[0].split('#',1)[0]
                  target=os.path.normpath(os.path.join(os.path.dirname(p),raw))
                  candidates=[target,target+'.js',target+'.mjs',target+'.cjs',target+'.json',os.path.join(target,'index.js'),os.path.join(target,'index.mjs'),os.path.join(target,'index.cjs')]
                  if not any(os.path.exists(c) for c in candidates): bad.append((p,m.group(1)))
          print('BROKEN_RELATIVE_IMPORTS='+str(len(bad)))
          for p,t in bad: print(f'{p}: {t}')
          PY
          cat audit-output/import-check.txt

      - name: Duplicate and case-collision analysis
        shell: bash
        run: |
          python3 - <<'PY' > audit-output/duplicates.txt
          import hashlib,subprocess,collections
          files=subprocess.check_output(['git','ls-files'], text=True).splitlines()
          byhash=collections.defaultdict(list); bycase=collections.defaultdict(list); bybase=collections.defaultdict(list)
          for p in files:
              bycase[p.lower()].append(p); bybase[p.rsplit('/',1)[-1].lower()].append(p)
              try:b=open(p,'rb').read()
              except Exception:continue
              if b'\0' not in b: byhash[hashlib.sha256(b).hexdigest()].append(p)
          exact=[v for v in byhash.values() if len(v)>1]
          case=[v for v in bycase.values() if len(v)>1]
          base=[v for v in bybase.values() if len(v)>1]
          print('EXACT_DUPLICATE_GROUPS='+str(len(exact)))
          for v in exact: print('EXACT | '+' | '.join(v))
          print('CASE_COLLISIONS='+str(len(case)))
          for v in case: print('CASE | '+' | '.join(v))
          print('DUPLICATE_BASENAME_GROUPS='+str(len(base)))
          for v in base: print('BASENAME | '+' | '.join(v))
          PY
          sed -n '1,240p' audit-output/duplicates.txt

      - name: Security and reliability pattern scan
        shell: bash
        run: |
          set +e
          {
            echo '=== POSSIBLE HARDCODED SECRETS ==='
            git grep -nEI '(discord[_-]?(token|secret)|bot[_-]?token|api[_-]?key|client[_-]?secret|private[_-]?key|password[[:space:]]*[:=]|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@)' -- ':!package-lock.json' ':!*.map' || true
            echo '=== PROCESS EXECUTION ==='
            git grep -nEI '\beval[[:space:]]*\(|new Function[[:space:]]*\(|child_process|execSync[[:space:]]*\(|spawnSync[[:space:]]*\(|exec[[:space:]]*\(|spawn[[:space:]]*\(' -- '*.js' '*.mjs' '*.cjs' || true
            echo '=== SYNC FILESYSTEM ==='
            git grep -nE '\b(readFileSync|writeFileSync|appendFileSync|readdirSync|statSync|existsSync|mkdirSync|rmSync|unlinkSync)\b' -- '*.js' '*.mjs' '*.cjs' || true
            echo '=== SILENT CATCHES ==='
            git grep -nE 'catch[[:space:]]*\([^)]*\)[[:space:]]*\{[[:space:]]*\}|catch[[:space:]]*\{[[:space:]]*\}|\.catch\(\(\)[[:space:]]*=>[[:space:]]*\{[[:space:]]*\}\)' -- '*.js' '*.mjs' '*.cjs' || true
            echo '=== TIMERS ==='
            git grep -nE '\bset(Interval|Timeout)[[:space:]]*\(' -- '*.js' '*.mjs' '*.cjs' || true
            echo '=== PROCESS EXIT ==='
            git grep -nE 'process\.exit[[:space:]]*\(' -- '*.js' '*.mjs' '*.cjs' || true
            echo '=== TODO FIXME HACK XXX ==='
            git grep -nEI '\b(TODO|FIXME|HACK|XXX)\b' || true
            echo '=== CONSOLE CALLS ==='
            git grep -nE '\bconsole\.(log|warn|error|debug|trace)[[:space:]]*\(' -- '*.js' '*.mjs' '*.cjs' || true
          } > audit-output/pattern-scan.txt
          wc -l audit-output/pattern-scan.txt
          exit 0

      - name: Git hygiene
        shell: bash
        run: |
          set +e
          {
            echo '=== IGNORED BUT TRACKED ==='
            git ls-files -ci --exclude-standard || true
            echo '=== TEMP BACKUP ARTIFACTS ==='
            git ls-files | grep -Ei '(^|/)(tmp|temp|backup|backups|old|archive)(/|$)|\.(bak|old|orig|tmp|swp)$|~$' || true
            echo '=== EXECUTABLE TRACKED FILES ==='
            git ls-files -s | awk '$1 ~ /^1007/ {print}' || true
          } > audit-output/git-hygiene.txt
          cat audit-output/git-hygiene.txt
          exit 0

      - name: Docker production build parity
        shell: bash
        run: |
          set +e
          docker build -t cloudy-deep-audit:local . > audit-output/docker-build.txt 2>&1
          code=$?
          echo "$code" > audit-output/docker-build.exit
          if [ "$code" -eq 0 ]; then
            docker image inspect cloudy-deep-audit:local --format '{{.Id}} {{.Size}}' > audit-output/docker-image.txt 2>&1 || true
          fi
          tail -n 120 audit-output/docker-build.txt || true
          exit 0

      - name: Final audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "TRACKED_FILES=$(git ls-files | wc -l)"
            echo "JS_FILES=$(git ls-files '*.js' | wc -l)"
            echo "SYNTAX_FAILURES=$(cat audit-output/syntax-failures.count 2>/dev/null || echo unknown)"
            echo "LINT_EXIT=$(cat audit-output/lint.exit 2>/dev/null || echo unknown)"
            echo "TEST_EXIT=$(cat audit-output/tests.exit 2>/dev/null || echo unknown)"
            echo "NPM_AUDIT_EXIT=$(cat audit-output/npm-audit.exit 2>/dev/null || echo unknown)"
            echo "NPM_AUDIT_PROD_EXIT=$(cat audit-output/npm-audit-prod.exit 2>/dev/null || echo unknown)"
            echo "DOCKER_BUILD_EXIT=$(cat audit-output/docker-build.exit 2>/dev/null || echo unknown)"
            cat audit-output/runtime-patch-summary.txt 2>/dev/null || true
            cat audit-output/import-check.txt 2>/dev/null || true
          } | tee audit-output/final-summary.txt

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudy-deep-audit-v2
          path: audit-output/
          if-no-files-found: error
