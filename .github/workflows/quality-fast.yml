name: Fast Quality Check

on:
  push:
    branches:
      - main
      - 'chatgpt-*'
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.github/workflows/quality-fast.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.github/workflows/quality-fast.yml'
  workflow_dispatch:

concurrency:
  group: fast-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-${{ github.ref_name }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-
            eslint-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate Railway startup patches
        shell: bash
        run: |
          STARTUP_CHECK_DIR="$(mktemp -d)"
          cp -a . "$STARTUP_CHECK_DIR/repo"
          cd "$STARTUP_CHECK_DIR/repo"
          rm -f .startup-patches.json
          node scripts/apply-startup-patches.js
          node --check src/commands/Tools/embedbuilder.js
          node --check src/commands/Tools/zz_embedbuilderLiveSearchPatch.js
          node --check src/services/embedManagerService.js
          grep -Fq "registerBuilderPreviewMessage(previewMessage)" src/commands/Tools/embedbuilder.js
          grep -Eq "(async )?function refreshBuilderPreviewOnly\\(" src/commands/Tools/embedbuilder.js

      # Final release gate. npm test runs startup migrations that rewrite source
      # files, so lint must finish first; running both against one checkout races
      # ESLint against file mutations and creates nondeterministic parser failures.
      - name: Lint
        run: npm run lint:fast

      - name: Tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=moderate
