name: Fast Quality Check

on:
  push:
    branches:
      - main
      - 'chatgpt-*'
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.github/workflows/quality-fast.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.github/workflows/quality-fast.yml'
  workflow_dispatch:

concurrency:
  group: fast-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-${{ github.ref_name }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-
            eslint-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # Static checks are independent of test-suite hangs.
      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Lint entire repository
        run: npm run lint:fast
 
  full-regressions:
    name: Full regression suite (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Run isolated test shard with bounded execution
        shell: bash
        run: |
          set -euo pipefail
          # Node sharding covers the entire discovered regression suite.
          # A hung test fails its named shard rather than holding every check
          # for 25 minutes or being silently treated as passing.
          timeout --signal=TERM --kill-after=10s 9m \
            node --test --test-concurrency=3 --test-timeout=120000 \
            --test-shard=${{ matrix.shard }}/8
