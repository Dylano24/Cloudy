name: Verify Cloudy media references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-cloudy-logo-references.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/migrate-cloudy-logo-references.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify immutable Cloudy media URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          logo = 'https://cdn.jsdelivr.net/gh/Dylano24/Cloudy@646fdaacabd0811da7ef2eca6df82ce32c078552/assets/cloudy-c-logo-static.png'
          banner = 'https://cdn.jsdelivr.net/gh/Dylano24/Cloudy@f2fc2ba3873d420bcdda0e3ea260cf5d312e528a/assets/cloudy-dynamic-banner.gif'

          runtime_files = list(Path('src').rglob('*.js'))
          direct_github = [
              str(path) for path in runtime_files
              if 'https://raw.githubusercontent.com/Dylano24/Cloudy/' in path.read_text(encoding='utf-8')
          ]
          if direct_github:
              raise SystemExit(f'Direct GitHub runtime media URL found in: {direct_github}')

          logo_path = Path('assets/cloudy-c-logo-static.png')
          expected_sha256 = 'a832b284d5260511042440fc89eee8927a68d95d9659d39f88ccc0b11a42d3b0'
          if not logo_path.exists() or hashlib.sha256(logo_path.read_bytes()).hexdigest() != expected_sha256:
              raise SystemExit('Static Cloudy logo file is missing or has changed')

          service = Path('src/services/cloudyLogoService.js').read_text(encoding='utf-8')
          if logo not in service or banner not in service:
              raise SystemExit('Central Cloudy media service is not pinned to the approved immutable CDN URLs')

          migration = Path('src/events/cloudyLogoMigrationReady.js').read_text(encoding='utf-8')
          if 'const LOGO_MIGRATION_VERSION = 3;' not in migration:
              raise SystemExit('Cloudy media migration version must remain at version 3')

          builder = Path('src/commands/Tools/embedbuilder.js').read_text(encoding='utf-8')
          if 'CLOUDY_LOGO_URL' not in builder:
              raise SystemExit('Embed Builder does not use the central Cloudy logo URL')

          print('Cloudy runtime media references are immutable and centrally managed.')
          PY

      - name: Syntax-check media migration code
        run: |
          node --check src/services/cloudyLogoService.js
          node --check src/events/cloudyLogoMigrationReady.js
          node --check src/commands/Tools/embedbuilder.js
