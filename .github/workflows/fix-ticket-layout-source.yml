name: Fix ticket layout source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-ticket-layout-source.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply direct ticket layout source fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ticket renderers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path('src/services/ticketUiService.js')
          ui = ui_path.read_text()
          start = ui.index('export async function syncCloudyTicketMessage(channel) {')
          end = ui.index('export async function syncCloudyTicketChannelName(channel) {', start)
          replacement = '''export async function syncCloudyTicketMessage(channel) {
            try {
              return await renderTicketV2(channel);
            } catch (error) {
              logger.warn('Could not sync Cloudy ticket UI', {
                guildId: channel?.guild?.id,
                channelId: channel?.id,
                error: error.message,
              });
              return false;
            }
          }

          '''
          ui = ui[:start] + replacement + ui[end:]
          ui_path.write_text(ui)

          ticket_path = Path('src/services/ticket.js')
          ticket = ticket_path.read_text()
          branding_import = "import { forceCloudyTicketFooter } from '../utils/ticket/ticketBranding.js';\n"
          if branding_import not in ticket:
            marker = "import { logTicketEvent } from '../utils/ticket/ticketLogging.js';\n"
            if marker not in ticket:
              raise SystemExit('Could not find ticket logging import')
            ticket = ticket.replace(marker, marker + branding_import, 1)

          block_start_marker = '    const priorityInfo = PRIORITY_MAP[priority] || PRIORITY_MAP.none;'
          block_end_marker = '    await ticketMessage.pin().catch(() => {});'
          block_start = ticket.index(block_start_marker)
          block_end = ticket.index(block_end_marker, block_start) + len(block_end_marker)
          new_block = r'''    const embed = forceCloudyTicketFooter(createEmbed({
              title: `Ticket #${ticketNumber}`,
              description:
                `${member.toString()}, we’ve received your request!\n\n`
                + 'To help us process your ticket as quickly as possible, please provide any additional details you believe may be useful, along with any screenshots or files that could help us better understand your situation.\n\n'
                + '**Please do not tag or spam our staff members for updates.** We can see your messages and have received all the information you’ve provided. If you don’t receive an immediate response, it simply means that we may be busy elsewhere or handling other requests.\n\n'
                + 'Please be patient and allow us some time to review your ticket and get back to you.\n\n'
                + 'We appreciate your understanding!\n\n'
                + `**Reason:** ${reason}`,
              color: '#FFFFFF',
            }));

            const row = new ActionRowBuilder().addComponents(
              new ButtonBuilder()
                .setCustomId('ticket_claim')
                .setLabel('Claim')
                .setStyle(ButtonStyle.Success)
                .setEmoji('✋🏽'),
              new ButtonBuilder()
                .setCustomId('ticket_pin')
                .setLabel('Pin')
                .setStyle(ButtonStyle.Secondary)
                .setEmoji('📌'),
              new ButtonBuilder()
                .setCustomId('ticket_close')
                .setLabel('Close')
                .setStyle(ButtonStyle.Danger)
                .setEmoji('🔒'),
            );

            const ticketMessage = await channel.send({
              embeds: [embed],
              components: [row],
              allowedMentions: { parse: [] },
            });

            ticketData.ticketNumber = String(ticketNumber);
            ticketData.ticketMessageId = ticketMessage.id;
            await saveTicketData(guild.id, channel.id, ticketData);
            await ticketMessage.pin().catch(() => {});'''
          ticket = ticket[:block_start] + new_block + ticket[block_end:]
          ticket_path.write_text(ticket)

          for guard in [
            Path('src/events/ticketLayoutGuardCreate.js'),
            Path('src/events/ticketLayoutGuardUpdate.js'),
          ]:
            if guard.exists():
              guard.unlink()
          PY

      - name: Check syntax
        run: |
          node --check src/services/ticket.js
          node --check src/services/ticketUiService.js
          node --check src/services/ticketV2LayoutService.js

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/ticket.js src/services/ticketUiService.js src/events/ticketLayoutGuardCreate.js src/events/ticketLayoutGuardUpdate.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make ticket layout render in one pass"
          git push
