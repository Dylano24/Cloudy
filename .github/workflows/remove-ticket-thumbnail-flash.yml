name: Remove ticket thumbnail flash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-ticket-thumbnail-flash.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply ticket thumbnail flash fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove default thumbnail from initial ticket embed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/ticket.js')
          s = p.read_text()
          marker = "`${member.toString()}, we’ve received your request!\\n\\n`"
          start = s.index(marker)
          needle = "    color: '#FFFFFF',\n  }));"
          pos = s.index(needle, start)
          s = s[:pos] + "    color: '#FFFFFF',\n    thumbnail: {},\n  }));" + s[pos + len(needle):]
          p.write_text(s)
          PY
      - name: Check syntax
        run: node --check src/services/ticket.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/ticket.js
          git commit -m "Prevent ticket thumbnail flash"
          git push
