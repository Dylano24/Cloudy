name: Materialize exact Cloudy logo

on:
  push:
    branches: [main]
    paths:
      - 'assets/cloudy-c-logo-data/**'
      - 'assets/cloudy-c-logo-exact-parts/**'
      - '.github/workflows/materialize-cloudy-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact AUF AUF GIF
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          legacy = sorted(Path('assets/cloudy-c-logo-data').glob('*.b64'))
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in legacy)
          encoded += '=' * (-len(encoded) % 4)
          prefix = base64.b64decode(encoded, validate=True)
          print('stored-prefix-bytes=', len(prefix))
          print('stored-prefix-sha256=', hashlib.sha256(prefix).hexdigest())

          expected_prefix_sha = '0bfd0f7e0a97a5cabe41ff7d98f51c000758d84f9b7c803214921e616b82d1cb'
          exact_parts = sorted(Path('assets/cloudy-c-logo-exact-parts').glob('*.bin'))
          if hashlib.sha256(prefix).hexdigest() == expected_prefix_sha:
              data = prefix + b''.join(p.read_bytes() for p in exact_parts)
          else:
              data = b''.join(p.read_bytes() for p in exact_parts)

          Path('assets/cloudy-c-logo-auf-auf.gif').write_bytes(data)
          print('rebuilt-bytes=', len(data))
          print('binary-sha256=', hashlib.sha256(data).hexdigest())
          PY

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Verify exact AUF AUF animation
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib, struct

          path = Path('assets/cloudy-c-logo-auf-auf.gif')
          im = Image.open(path)
          h = hashlib.sha256()
          h.update(struct.pack('<II', *im.size))
          h.update(struct.pack('<I', im.n_frames))
          h.update(struct.pack('<I', im.info.get('loop', 0)))
          durations = []
          for i in range(im.n_frames):
              im.seek(i)
              duration = im.info.get('duration', 0)
              durations.append(duration)
              h.update(struct.pack('<I', duration))
              h.update(im.convert('RGBA').tobytes())

          expected = 'a1d78814bd281d9f035a85029746808b0c4fb61a96cce708b3436d5669c8de1c'
          actual = h.hexdigest()
          print('size=', im.size, 'frames=', im.n_frames, 'durations=', sorted(set(durations)))
          print('visual_hash=', actual)
          assert im.size == (555, 609)
          assert im.n_frames == 23
          assert set(durations) == {40}
          assert actual == expected, 'AUF AUF is not the approved pixel-exact animation'
          print('EXACT AUF AUF MATCH')
          PY

      - name: Commit verified binary GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cloudy-c-logo-auf-auf.gif
          git diff --cached --quiet && exit 0
          git commit -m "Install verified AUF AUF Cloudy logo"
          git push
