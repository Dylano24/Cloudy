name: Materialize Cloudy logo

on:
  push:
    branches: [main]
    paths:
      - 'assets/cloudy-c-logo-auf-auf.gif.b64'
      - '.github/workflows/materialize-cloudy-logo.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact AUF AUF GIF
        run: base64 --decode assets/cloudy-c-logo-auf-auf.gif.b64 > assets/cloudy-c-logo-auf-auf.gif
      - name: Commit binary asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cloudy-c-logo-auf-auf.gif
          git diff --cached --quiet && exit 0
          git commit -m "Add exact AUF AUF Cloudy logo asset"
          git push
